[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "muma-bank"
version = "0.1.0"
description = "Demo banking API for the Muma Bank Kubernetes learning platform"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "Flask==3.1.3",
  "gunicorn==23.0.0",
  "prometheus-client==0.25.0",
  "psycopg[binary]==3.3.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.1",
]

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
muma_bank = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=muma_bank --cov-report=term-missing --cov-fail-under=90"
testpaths = ["app/tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
