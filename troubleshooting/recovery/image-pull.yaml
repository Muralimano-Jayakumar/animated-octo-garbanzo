apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-pull-lab
  namespace: muma-bank-labs
spec:
  replicas: 1
  selector:
    matchLabels:
      lab: image-pull
  template:
    metadata:
      labels:
        lab: image-pull
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: muma-bank:dev
          imagePullPolicy: Never
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
