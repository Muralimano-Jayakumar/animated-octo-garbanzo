apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-lab
  namespace: muma-bank-labs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: storage-lab
  namespace: muma-bank-labs
  labels:
    lab: storage
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: writer
      image: muma-bank:dev
      imagePullPolicy: Never
      command: ["python", "-c"]
      args: ["from pathlib import Path; Path('/data/recovered').write_text('ok'); import time; time.sleep(3600)"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 50m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: storage-lab
